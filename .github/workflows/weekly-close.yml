name: weekly-close
on:
  schedule:
    # GitHub cron is UTC-only and Israel flips UTC+2/+3, so schedule both
    # candidate hours; the in-script guard runs the job only in the intended
    # local window (docs/03).
    - cron: "5 21 * * SAT"   # Sun 00:05 IDT (summer) — just after the Sat-midnight lock
    - cron: "5 22 * * SAT"   # Sun 00:05 IST (winter)
    - cron: "5 9 * * WED"    # Wednesday finalize run (docs/06)
    - cron: "5 10 * * WED"
  workflow_dispatch: {}

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./pipeline
      - name: DST guard
        id: guard
        run: |
          # Intended local windows: 00:0x Sunday (post-lock close) and 12:0x
          # Wednesday (finalize). Each is scheduled at both candidate UTC hours,
          # so exactly one of the pair lands in the window for the current DST offset.
          H=$(TZ=Asia/Jerusalem date +%H)
          if [ "$H" = "00" ] || [ "$H" = "12" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Close week (flip statuses, carry forward, recompute scores)
        if: steps.guard.outputs.run == 'yes'
        working-directory: pipeline
        run: python cli.py close
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Weekly close failure $(date -u +%F)" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — jobs are idempotent, rerun after fixing (docs/06)."
